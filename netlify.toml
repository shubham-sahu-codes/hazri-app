# Netlify deployment config for this TanStack Start (Vite + Nitro) app.
# Build target is set in vite.config.ts via `nitro: { preset: "netlify" }`.
# Nitro emits:
#   - static client assets -> dist/
#   - SSR / server functions -> .netlify/functions-internal/server (auto-detected by Netlify)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "none"
